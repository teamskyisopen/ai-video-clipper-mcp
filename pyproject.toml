[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-clipper-mcp"
version = "0.1.0"
description = "AI-powered Video Clipper MCP service with modular Hexagonal architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "loguru>=0.7.2",
    "mcp>=1.0.0",
    "yt-dlp>=2024.4.9",
    "ffmpeg-python>=0.2.0",
    "faster-whisper>=1.2.0",
    "google-genai>=2.33.0",
    "opencv-python>=4.9.0",
    "scenedetect>=0.7.2",
]

[project.scripts]
ai-video-clipper = "cli:main"
